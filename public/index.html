tListener(\"change\", async e => {\n    const sel = e.target.closest(\".svcStatusSel\");\n    if(!sel) return;\n    try{\n      const s = await API.updateService(sel.dataset.id, sel.value);\n      const i = adminServices.findIndex(x => x.id === s.id);\n      if(i >= 0) adminServices[i] = s;\n      toast(`${s.name} for ${s.addedBy} marked ${s.status.toLowerCase()}.`);\n    }catch(err){\n      toast(err.message);\n      try{ adminServices = await API.adminServices(); }catch(e2){}\n    }\n    renderServiceDesk();\n  });\n\n  function renderDesk(){\n    const all = state.tickets;\n    const pending = all.filter(t => t.status === \"Pending\").length;\n    const progress = all.filter(t => t.status === \"In progress\").length;\n    const resolved = all.filter(t => t.status === \"Resolved\").length;\n    $(\"#deskStrip\").innerHTML = `\n      <div class=\"stat st-pending\"><b>${pending}<\/b><span>Pending<\/span><\/div>\n      <div class=\"stat st-progress\"><b>${progress}<\/b><span>In progress<\/span><\/div>\n      <div class=\"stat st-resolved\"><b>${resolved}<\/b><span>Resolved<\/span><\/div>\n      <div class=\"stat st-total\"><b>${all.length}<\/b><span>Total<\/span><\/div>`;\n\n    const cats = [...new Set(all.map(t => t.cat))];\n    const sel = $(\"#filterCat\"), keep = sel.value;\n    sel.innerHTML = `<option value=\"all\">All categories<\/option>` + cats.map(c => `<option>${esc(c)}<\/option>`).join(\"\");\n    sel.value = [...sel.options].some(o => o.value === keep) ? keep : \"all\";\n\n    const fs = $(\"#filterStatus\").value, fc = sel.value;\n    const rows = all.filter(t => (fs === \"all\" || t.status === fs) && (fc === \"all\" || t.cat === fc));\n\n    $(\"#deskBody\").innerHTML = rows.length ? rows.map(t => `\n      <tr>\n        <td class=\"idcell\"><span class=\"catdot\" style=\"background:${CAT_DOT[t.cat]}\"><\/span>${esc(t.id)}<\/td>\n        <td>${esc(t.title)}<div class=\"muted\" style=\"font-size:.8rem\">${esc(t.cat)}${esc(t.cat)}<\/div>${t.photoData ? `<a href=\"${esc(t.photoData)}\" target=\"_blank\" rel=\"noopener\" class=\"muted\" style=\"font-size:.8rem;text-decoration:underline\">View attached photo</a>` : \"\"}<\/div><\/td>\n        <td>${esc(t.address)}<\/td>\n        <td>\n          <select class=\"statusSel\" data-id=\"${esc(t.id)}\">\n            ${STATUS_ORDER.map(s => `<option ${s === t.status ? \"selected\" : \"\"}>${s}<\/option>`).join(\"\")}\n          <\/select>\n        <\/td>\n      <\/tr>`).join(\"\")\n      : `<tr><td colspan=\"4\"><div class=\"empty\" style=\"border:0\"><h3>Nothing here<\/h3><p>Clear a filter to see other complaints.<\/p><\/div><\/td><\/tr>`;\n\n    const counts = {};\n    all.forEach(t => counts[t.cat] = (counts[t.cat] || 0) + 1);\n    const max = Math.max(1, ...Object.values(counts));\n    $(\"#catBars\").innerHTML = Object.entries(counts).sort((a,b) => b[1] - a[1]).map(([c,n]) => `\n      <div class=\"bar-row\">\n        <span>${esc(c)}<\/span>\n        <span class=\"bar-track\"><span class=\"bar-fill\" style=\"width:${Math.round(n / max * 100)}%;background:${CAT_DOT[c]}\"><\/span><\/span>\n        <b>${n}<\/b>\n      <\/div>`).join(\"\");\n\n    const pendingOldest = all.filter(t => t.status !== \"Resolved\").sort((a,b) => a.ts - b.ts)[0];\n    $(\"#oldest\").innerHTML = pendingOldest\n      ? `<b style=\"color:var(--ink)\">${esc(pendingOldest.id)}<\/b> \u2014 ${esc(pendingOldest.title)}<br>Open since ${ago(pendingOldest.ts)}, at ${esc(pendingOldest.address)}.`\n      : \"Nothing pending. The block is clear.\";\n  }\n\n  $(\"#filterStatus\").addEventListener(\"change\", renderDesk);\n  $(\"#filterCat\").addEventListener(\"change\", renderDesk);\n  $(\"#deskBody\").addEventListener(\"change\", async e => {\n    const sel = e.target.closest(\".statusSel\");\n    if(!sel) return;\n    try{\n      const t = await API.updateStatus(sel.dataset.id, sel.value);\n      const i = state.tickets.findIndex(x => x.id === t.id);\n      if(i >= 0) state.tickets[i] = t;\n      toast(`${t.id} marked ${t.status.toLowerCase()}.`);\n    }catch(err){\n      toast(err.message);\n      try{ state.tickets = await API.list(\"all\"); }catch(e2){}\n    }\n    renderDesk();\n  });\n  /* Adds back any missing demo complaints (never deletes real records). */\n  if($(\"#resetBtn\")) $(\"#resetBtn\").addEventListener(\"click\", async () => {\n    if(!confirm(\"Add the sample demo complaints that are missing? Existing complaints are kept.\")) return;\n    try{\n      const r = await API.reloadDemo();\n      toast(r.added ? r.added + \" demo complaints added.\" : \"Demo data is already loaded.\");\n      state.tickets = await API.list(\"all\");\n      renderDesk();\n    }catch(err){ toast(err.message); }\n  });\n\n  renderDesk();\n  renderServiceDesk();\n}\n\n} /* end boot() */\n\nboot();\n<\/script>\n<script>document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(!a)return;var h=a.getAttribute('href');if(/\\.html(\\?|$)/.test(h)){e.preventDefault();parent.go(h);}});<\/script><\/body>\n<\/html>\n", "complaints.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Your Complaints \u2014 Smart Society<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Newsreader:ital@1&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n<style>/* ============================================================\n   SMART SOCIETY \u2014 Complaint & Service Portal\n   Cream / black / lime theme, sidebar navigation\n   B Block Mayfield Gardens RWA\n   ============================================================ */\n\n:root{\n  --cream:#F2F2F2; --paper:#FFFFFF; --ink:#2B6777; --ink-soft:#5C8794;\n  --line-soft:#C8D8E4; --lime:#52AB98; --amber:#17e1a1; --blue:#4C7EA8;\n  --green:#3F9D82; --purple:#7C7CA0;\n  --r-lg:20px; --r-md:16px; --r-sm:12px; --r-pill:999px;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\nbody{background:var(--cream);color:var(--ink);font-family:\"Inter\",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}\nh1,h2,h3{font-family:\"Space Grotesk\",\"Inter\",sans-serif;font-weight:700;letter-spacing:-.025em;margin:0}\n.tagline{font-family:\"Newsreader\",\"Georgia\",serif;font-style:italic;color:var(--ink-soft);font-size:1rem}\np{margin:0}\na{color:inherit;text-decoration:none}\nbutton,input,select,textarea{font:inherit;color:inherit}\n[hidden]{display:none !important}\n:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px;border-radius:6px}\n.muted{color:var(--ink-soft)}\nsvg.ic{width:1em;height:1em;display:inline-block;vertical-align:-.15em}\ncode{background:var(--cream);border:1px solid var(--line-soft);border-radius:5px;padding:.05rem .35rem;font-size:.85em}\n\n/* ---------- app shell ---------- */\n.app{display:flex;min-height:100vh}\n.main{flex:1;min-width:0;padding:2.4rem 2.8rem 4rem}\n.pagewrap{max-width:980px}\n\n/* ---------- sidebar ---------- */\n.sidebar{width:280px;flex:none;background:var(--ink);color:#F4F4F2;display:flex;flex-direction:column;padding:1.4rem 1.2rem;position:sticky;top:0;height:100vh;overflow-y:auto}\n.brand{display:flex;align-items:center;gap:.7rem;padding:.3rem .2rem 1.4rem;margin-bottom:.6rem;border-bottom:1px solid #3D7D8C}\n.brand-ico{width:42px;height:42px;flex:none;border-radius:12px;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-size:1.25rem}\n.brand b{display:block;font-family:\"Space Grotesk\",sans-serif;font-weight:700;font-size:1.05rem;color:#fff}\n.brand small{display:block;color:#A8C6CE;font-size:.74rem;line-height:1.3;margin-top:.1rem}\n.side-nav{display:flex;flex-direction:column;gap:.3rem;margin-top:1.1rem}\n.side-nav a{display:flex;align-items:center;gap:.75rem;padding:.72rem .9rem;border-radius:var(--r-sm);color:#C3DCE2;font-weight:600;font-size:.92rem}\n.side-nav a:hover{background:#3D7D8C;color:#fff}\n.side-nav a.is-on{background:var(--lime);color:var(--ink)}\n.side-spacer{flex:1;min-height:1.4rem}\n.user-card{border:1px solid #3D7D8C;border-radius:var(--r-md);padding:1rem;background:#245A68}\n.user-card b{display:block;color:#fff;font-size:.94rem}\n.user-card small{display:block;color:#A8C6CE;font-size:.8rem;margin:.2rem 0 .8rem}\n.side-foot{color:#8FB4BD;font-size:.72rem;line-height:1.5;margin-top:1rem;padding:0 .2rem}\n.mobile-bar{display:none}\n.scrim{display:none}\n\n/* ---------- buttons ---------- */\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:1.5px solid var(--ink);border-radius:var(--r-sm);padding:.78rem 1.3rem;font-weight:700;font-size:.85rem;letter-spacing:.02em;cursor:pointer;transition:transform .12s ease,filter .12s ease;background:var(--paper);color:var(--ink)}\n.btn:hover{filter:brightness(.97)}\n.btn:active{transform:translateY(1px)}\n.btn-lime{background:var(--lime);border-color:var(--ink)}\n.btn-dark{background:var(--ink);color:#fff;border-color:var(--ink)}\n.btn-outline{background:transparent}\n.btn-sm{padding:.5rem .85rem;font-size:.78rem;border-radius:10px}\n.wide{width:100%}\n\n/* ---------- page head ---------- */\n.pagehead{margin-bottom:1.8rem}\n.pagehead-row{display:flex;justify-content:space-between;align-items:flex-start;gap:1.2rem;flex-wrap:wrap}\n.pagehead h1{font-size:clamp(2rem,4vw,2.7rem);margin-top:.25rem}\n.pagehead .lede{color:var(--ink-soft);margin-top:.6rem;max-width:60ch;font-size:.96rem}\n\n/* ---------- stat cards ---------- */\n.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.85rem;margin-bottom:1.6rem}\n.stat{border:2px solid var(--ink);border-radius:var(--r-lg);padding:1.3rem 1.4rem;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}\n.stat b{font-family:\"Space Grotesk\",sans-serif;font-size:2.3rem;line-height:1}\n.stat span{font-weight:800;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;margin-top:.5rem}\n.stat.st-pending{background:var(--amber);color:var(--ink)}\n.stat.st-progress{background:var(--blue);color:#fff}\n.stat.st-resolved{background:var(--green);color:#fff}\n.stat.st-total{background:var(--ink);color:var(--lime)}\n\n/* ---------- SDG banner ---------- */\n.sdg{background:var(--ink);color:#EDEDE8;border-radius:var(--r-lg);padding:1.3rem 1.5rem;display:flex;gap:1rem;align-items:flex-start;margin-bottom:2rem}\n.sdg-ico{width:38px;height:38px;flex:none;border-radius:10px;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-size:1.1rem}\n.sdg p{font-size:.92rem;line-height:1.55}\n.sdg b{color:var(--lime)}\n\n/* ---------- section heads ---------- */\n.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}\n.sec-head h2{font-size:1.3rem}\n.view-all{font-weight:700;font-size:.85rem;display:inline-flex;align-items:center;gap:.35rem;border-bottom:2px solid var(--lime);padding-bottom:2px}\n\n/* ---------- generic cards ---------- */\n.card{background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--r-md)}\n.pad{padding:1.5rem}\n\n/* ---------- empty state ---------- */\n.empty{border:2px dashed var(--ink);border-radius:var(--r-lg);background:var(--paper);padding:3rem 1.5rem;text-align:center}\n.empty .ic-wrap{width:50px;height:50px;margin:0 auto .9rem;border-radius:50%;background:var(--cream);display:grid;place-items:center;color:var(--ink-soft);font-size:1.4rem}\n.empty h3{font-size:1.1rem;margin-bottom:.3rem}\n.empty p{color:var(--ink-soft);font-size:.9rem;margin-bottom:1.3rem}\n\n/* ---------- recent / ticket list rows ---------- */\n.ticket-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;border:1.5px solid var(--ink);border-radius:var(--r-md);padding:1.1rem 1.3rem;background:var(--paper)}\n.ticket-row + .ticket-row{margin-top:.7rem}\n.ticket-row .t-left{display:flex;align-items:center;gap:.9rem;min-width:0}\n.ticket-row .t-ico{width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:1.05rem;background:var(--cream)}\n.ticket-row h4{font-size:.96rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.ticket-row .t-meta{font-size:.8rem;color:var(--ink-soft);margin-top:.1rem}\n\n/* ---------- badges ---------- */\n.badge{display:inline-flex;align-items:center;border-radius:var(--r-pill);padding:.32rem .8rem;font-size:.74rem;font-weight:800;letter-spacing:.03em;white-space:nowrap}\n.badge.b-pending{background:var(--amber);color:var(--ink)}\n.badge.b-progress{background:var(--blue);color:#fff}\n.badge.b-resolved{background:var(--green);color:#fff}\n\n/* ---------- services grid ---------- */\n.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}\n.svc-card{border:1.5px solid var(--ink);border-radius:var(--r-md);background:var(--paper);padding:1.4rem;display:flex;flex-direction:column}\n.svc-ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:1.25rem;margin-bottom:.9rem}\n.svc-card h3{font-size:1.08rem;margin-bottom:.4rem}\n.svc-card p{font-size:.87rem;color:var(--ink-soft);flex:1}\n.svc-divider{border:0;border-top:1.5px dashed var(--line-soft);margin:1rem 0 .8rem}\n.svc-meta{display:flex;flex-direction:column;gap:.4rem;font-size:.83rem;color:var(--ink-soft);margin-bottom:1rem}\n.svc-meta span{display:flex;align-items:center;gap:.5rem}\n.svc-link{font-weight:700;font-size:.85rem;display:inline-flex;align-items:center;gap:.35rem;color:var(--ink)}\n\n/* ---------- filter pills ---------- */\n.pills{display:flex;gap:.55rem;flex-wrap:wrap;margin-bottom:1.4rem}\n.pill{border:1.5px solid var(--ink);border-radius:var(--r-pill);padding:.5rem 1.05rem;font-weight:800;font-size:.8rem;letter-spacing:.02em;background:var(--paper);color:var(--ink);cursor:pointer}\n.pill.is-on{background:var(--ink);color:var(--lime)}\n\n/* ---------- form ---------- */\n.field{margin-bottom:1.3rem}\n.field > label{display:block;font-weight:800;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.55rem;color:var(--ink-soft)}\ninput[type=text],input[type=tel],input[type=password],select,textarea{width:100%;background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--r-sm);padding:.78rem .9rem}\ninput::placeholder,textarea::placeholder{color:#93ADB6}\ninput:focus,textarea:focus,select:focus{outline:none;box-shadow:0 0 0 3px rgba(20,20,20,.08)}\ntextarea{min-height:120px;resize:vertical}\n.row2{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}\n\n.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}\n.cat{position:relative;border:1.5px solid var(--ink);border-radius:var(--r-sm);background:var(--paper);padding:.85rem .7rem;display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:.9rem;cursor:pointer}\n.cat input{position:absolute;inset:0;opacity:0;cursor:pointer}\n.cat:has(input:checked){background:#E4EDF3}\n.cat:has(input:focus-visible){outline:2.5px solid var(--ink);outline-offset:2px}\n\n.pri{display:flex;gap:.65rem;flex-wrap:wrap}\n.pri label{position:relative;flex:1;min-width:90px;text-align:center;border:1.5px solid var(--ink);border-radius:var(--r-sm);padding:.72rem .9rem;font-weight:700;font-size:.88rem;background:var(--paper);cursor:pointer}\n.pri input{position:absolute;inset:0;opacity:0;cursor:pointer}\n.pri label:has(input:checked){background:var(--amber);color:var(--ink);border-color:var(--ink)}\n\n/* ---------- ticket detail ---------- */\n.ticket{border:1.5px solid var(--ink);border-radius:var(--r-md);background:var(--paper);padding:1.4rem}\n.ticket + .ticket{margin-top:.9rem}\n.ticket-top{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;flex-wrap:wrap;margin-bottom:.7rem}\n.ticket-top h4{font-size:1.02rem}\n.ticket-top .meta{font-size:.82rem;color:var(--ink-soft);margin-top:.25rem}\n.timeline{border-left:2px solid var(--line-soft);margin:1.1rem 0 0 .55rem;padding-left:1.2rem;display:grid;gap:.9rem}\n.tl-item{position:relative;font-size:.86rem}\n.tl-item::before{content:\"\";position:absolute;left:-1.68rem;top:.28rem;width:11px;height:11px;border-radius:50%;background:var(--paper);border:2px solid var(--line-soft)}\n.tl-item.done::before{background:var(--green);border-color:var(--green)}\n.tl-item.current::before{background:var(--amber);border-color:var(--amber)}\n.tl-item h5{margin:0;font-weight:700;font-size:.88rem}\n.tl-item p{color:var(--ink-soft);font-size:.82rem}\n\n/* ---------- admin table ---------- */\n.table-toolbar{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}\n.table-toolbar select{width:auto;min-width:150px;padding:.55rem .75rem}\n.table-scroll{overflow-x:auto;border:1.5px solid var(--ink);border-radius:var(--r-md);background:var(--paper)}\ntable{width:100%;border-collapse:collapse;font-size:.87rem}\nth{text-align:left;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:800;padding:.85rem 1rem;border-bottom:1.5px solid var(--ink)}\ntd{padding:.85rem 1rem;border-bottom:1px solid var(--line-soft);vertical-align:middle}\ntr:last-child td{border-bottom:0}\ntd.idcell{font-weight:800;white-space:nowrap}\ntd select{width:auto;min-width:130px;padding:.4rem .55rem;font-size:.82rem}\n.catdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:.55rem}\n.two-col{display:grid;grid-template-columns:1.35fr .65fr;gap:1.4rem;align-items:start}\n.bars{display:grid;gap:.75rem}\n.bar-row{display:grid;grid-template-columns:100px 1fr 26px;gap:.7rem;align-items:center;font-size:.83rem}\n.bar-track{height:9px;background:var(--cream);border:1px solid var(--line-soft);border-radius:999px;overflow:hidden}\n.bar-fill{display:block;height:100%}\n.bar-row b{text-align:right;font-size:.8rem;color:var(--ink-soft)}\n\n/* ---------- login / signup ---------- */\n.login-page{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:2rem 1.2rem}\n.login-card{width:100%;max-width:440px;background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--r-lg);padding:2.1rem}\n.login-tabs{display:flex;gap:.4rem;background:var(--cream);border:1.5px solid var(--ink);border-radius:var(--r-sm);padding:.28rem;margin:1.3rem 0 1.5rem}\n.login-tabs button{flex:1;border:0;background:transparent;padding:.6rem;border-radius:9px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--ink-soft)}\n.login-tabs button.is-on{background:var(--ink);color:var(--lime)}\n.error-note{background:#FCEBE7;border:1.5px solid #D9432C;color:#9A2A19;border-radius:10px;padding:.65rem .85rem;font-size:.84rem;font-weight:600;margin-bottom:1rem}\n.ok-note{background:#E7F8EF;border:1.5px solid #12B76A;color:#0B6B41;border-radius:10px;padding:.65rem .85rem;font-size:.84rem;font-weight:600;margin-bottom:1rem}\n.mode-toggle{text-align:center;margin-top:1.1rem;font-size:.86rem;color:var(--ink-soft)}\n.mode-toggle button{background:none;border:0;font-weight:800;color:var(--ink);text-decoration:underline;cursor:pointer;padding:0;font-family:inherit;font-size:inherit}\n.field[data-only=\"signup\"]{display:none}\nform.mode-signup .field[data-only=\"signup\"]{display:block}\n\n/* ---------- toast ---------- */\n.toast{position:fixed;left:50%;bottom:1.6rem;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--lime);font-weight:700;font-size:.9rem;padding:.85rem 1.3rem;border-radius:var(--r-sm);box-shadow:0 16px 34px -14px rgba(0,0,0,.4);max-width:calc(100% - 2rem)}\n\n/* ---------- responsive ---------- */\n@media (max-width:980px){ .svc-grid{grid-template-columns:repeat(2,1fr)} .stats{grid-template-columns:repeat(2,1fr)} }\n@media (max-width:900px){\n  .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .22s ease;width:280px}\n  body.nav-open .sidebar{transform:translateX(0)}\n  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}\n  body.nav-open .scrim{display:block}\n  .mobile-bar{display:flex;align-items:center;gap:.9rem;justify-content:space-between;padding:1rem 1.2rem;border-bottom:1.5px solid var(--ink);background:var(--cream);position:sticky;top:0;z-index:30}\n  .mobile-bar .brand{border:0;padding:0;margin:0}\n  .mobile-bar .brand small{display:none}\n  .menu-btn{border:1.5px solid var(--ink);background:var(--paper);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}\n  .main{padding:1.6rem 1.2rem 3rem}\n  .two-col{grid-template-columns:1fr}\n}\n@media (max-width:640px){\n  .stats{grid-template-columns:1fr 1fr}\n  .svc-grid{grid-template-columns:1fr}\n  .row2{grid-template-columns:1fr}\n  .cats{grid-template-columns:repeat(2,1fr)}\n  .pagehead-row{align-items:stretch}\n  .pagehead-row .btn{width:100%}\n}\n\n/* ---------- service add button ---------- */\n.svc-add-btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:.72rem 1rem;border-radius:var(--r-sm);font-family:inherit;cursor:pointer;justify-content:center;text-decoration:none;width:100%}\n.svc-add-btn:hover{opacity:.9}\n.svc-add-btn.service-added{background:var(--lime);color:var(--ink);cursor:default}\n.svc-add-btn:disabled{opacity:1}\n<\/style>\n<\/head>\n<body>\n<div class=\"scrim\" id=\"scrim\"><\/div>\n<div class=\"app\">\n<aside class=\"sidebar\" id=\"sidebar\">\n  <a class=\"brand\" href=\"dashboard.html\">\n    <span class=\"brand-ico\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 21V6a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v15\"/><path d=\"M14 21v-9a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v9\"/><path d=\"M4 21h16M7 9h1M7 13h1M7 17h1M10 9h1M10 13h1M10 17h1M17 13h1M17 17h1\"/><\/svg><\/span>\n    <span>\n      <b>Smart Society<\/b>\n      <small>B Block &middot; Mayfield Gardens RWA<\/small>\n    <\/span>\n  <\/a>\n  <nav class=\"side-nav\">\n      <a href=\"dashboard.html\" data-nav=\"dashboard\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.6\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.6\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.6\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.6\"/><\/svg><span>Dashboard<\/span><\/a>\n      <a href=\"services.html\" data-nav=\"services\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.7 6.3a4 4 0 0 0-5.6 5.2L3 17.6V21h3.4l6.1-6.1a4 4 0 0 0 5.2-5.6l-2.6 2.6-2-2 2.6-2.6z\"/><\/svg><span>Services<\/span><\/a>\n      <a href=\"complaints.html\" data-nav=\"complaints\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 6h11M9 12h11M9 18h11\"/><path d=\"m3 6 1.4 1.4L7 4.6M3 12l1.4 1.4L7 10.6M3 18l1.4 1.4L7 16.6\"/><\/svg><span>Your Complaints<\/span><\/a>\n      <a href=\"new-complaint.html\" data-nav=\"new-complaint\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 8v8M8 12h8\"/><\/svg><span>New Complaint<\/span><\/a>\n      <a href=\"admin.html\" data-nav=\"admin\" id=\"adminNavLink\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"8\" cy=\"15\" r=\"4\"/><path d=\"M10.8 12.2 20 3M17 6l2 2M14 9l2 2\"/><\/svg><span>Admin<\/span><\/a>\n  <\/nav>\n  <div class=\"side-spacer\"><\/div>\n  <div class=\"user-card\">\n    <b id=\"sideName\">Resident<\/b>\n    <small id=\"sideMeta\">Address &mdash; &middot; Resident<\/small>\n    <button class=\"btn btn-lime wide\" id=\"logoutBtn\" type=\"button\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 17l5-5-5-5M15 12H3M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4\"/><\/svg> LOG OUT<\/button>\n  <\/div>\n  <p class=\"side-foot\">Aligned with UN SDG 11 &mdash; Sustainable Cities &amp; Communities<\/p>\n<\/aside>\n\n<div style=\"flex:1;min-width:0;display:flex;flex-direction:column\">\n  <div class=\"mobile-bar\">\n    <a class=\"brand\" href=\"dashboard.html\">\n      <span class=\"brand-ico\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 21V6a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v15\"/><path d=\"M14 21v-9a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v9\"/><path d=\"M4 21h16M7 9h1M7 13h1M7 17h1M10 9h1M10 13h1M10 17h1M17 13h1M17 17h1\"/><\/svg><\/span>\n      <span><b>Smart Society<\/b><small>B Block &middot; Mayfield Gardens RWA<\/small><\/span>\n    <\/a>\n    <button class=\"menu-btn\" id=\"menuBtn\" type=\"button\" aria-label=\"Open menu\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 7h16M4 12h16M4 17h16\"/><\/svg><\/button>\n  <\/div>\n  <main class=\"main\">\n    <div class=\"pagewrap\">\n\n      <div class=\"pagehead\">\n        <div class=\"pagehead-row\">\n          <div>\n            <p class=\"tagline\">Track every request<\/p>\n            <h1>Your Complaints<\/h1>\n          <\/div>\n          <a class=\"btn btn-lime\" href=\"new-complaint.html\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg> NEW COMPLAINT<\/a>\n        <\/div>\n      <\/div>\n      <div class=\"pills\" id=\"filterPills\">\n        <button class=\"pill is-on\" data-filter=\"all\">ALL <span id=\"cnt-all\">0<\/span><\/button>\n        <button class=\"pill\" data-filter=\"Pending\">PENDING <span id=\"cnt-pending\">0<\/span><\/button>\n        <button class=\"pill\" data-filter=\"In progress\">IN PROGRESS <span id=\"cnt-progress\">0<\/span><\/button>\n        <button class=\"pill\" data-filter=\"Resolved\">RESOLVED <span id=\"cnt-resolved\">0<\/span><\/button>\n      <\/div>\n      <div id=\"complaintsList\"><\/div>\n\n    <\/div>\n  <\/main>\n<\/div>\n<\/div>\n\n<div class=\"toast\" id=\"toast\" hidden><\/div>\n<script>/* ============================================================\n   SMART SOCIETY \u2014 shared auth helpers\n   Loaded by every page (login + app pages) before their own script.\n   Accounts and sessions now live on the Flask backend (/api/auth).\n   The browser only holds an HttpOnly session cookie \u2014 no passwords\n   or account data are kept in localStorage any more.\n   ============================================================ */\n\n/* Small fetch wrapper: same-origin, JSON in/out, throws Error(message) on failure. */\nasync function api(path, opts){\n  opts = opts || {};\n  const init = {\n    method: opts.method || \"GET\",\n    credentials: \"same-origin\",\n    headers: { \"X-Requested-With\": \"fetch\" }\n  };\n  if(opts.body !== undefined){\n    init.headers[\"Content-Type\"] = \"application/json\";\n    init.body = JSON.stringify(opts.body);\n  }\n  let res, data = {};\n  try{\n    res = await fetch(path, init);\n  }catch(e){\n    throw new Error(\"Can't reach the server. Is the Flask app running?\");\n  }\n  try{ data = await res.json(); }catch(e){}\n  if(!res.ok || data.ok === false){\n    const err = new Error(data.error || \"Something went wrong. Please try again.\");\n    err.status = res.status;\n    throw err;\n  }\n  return data;\n}\n\nlet SESSION = null;\n\n/* Ask the server who is signed in (null if nobody). */\nasync function loadSession(){\n  try{\n    const d = await api(\"/api/auth/me\");\n    SESSION = d.user || null;\n  }catch(e){ SESSION = null; }\n  return SESSION;\n}\nfunction getSession(){ return SESSION; }\nasync function clearSession(){\n  try{ await api(\"/api/auth/logout\", { method: \"POST\" }); }catch(e){}\n  SESSION = null;\n}\n\nfunction currentUser(){\n  const s = getSession();\n  return s\n    ? { name: s.name, address: s.address || \"\u2014\", phone: s.phone || \"\" }\n    : { name:\"Resident\", address:\"\u2014\", phone:\"\" };\n}\n\n/* API calls now use the real Express backend. */<\/script>\n<script>/* ============================================================\n   SMART SOCIETY \u2014 Complaint & Service Portal\n   Shared script for every page after login.\n   Uses getSession/currentUser/etc from auth.js (loaded first).\n   Data now lives in the Flask/MongoDB backend (/api/...).\n   ============================================================ */\n\n/* ---------- page + session (session is loaded from the server in boot()) ---------- */\nconst PAGE = (window.__PAGE || \"dashboard.html\");\nlet session = null;\n\n/* ---------- category / status vocab ---------- */\nconst CAT_ICON = {\n  \"Maintenance\":\"wrench\",\"Water\":\"droplet\",\"Electricity\":\"bolt\",\n  \"Cleanliness\":\"sparkle\",\"Security\":\"shield\",\"Other\":\"circle_x\"\n};\nconst CAT_DOT = {\n  \"Maintenance\":\"#BF9552\",\"Water\":\"#4C7EA8\",\"Electricity\":\"#C9A63C\",\n  \"Cleanliness\":\"#3F9D82\",\"Security\":\"#7C7CA0\",\"Other\":\"#8A94A0\"\n};\nconst STATUS_ORDER = [\"Pending\",\"In progress\",\"Resolved\"];\nconst STATUS_CLASS = { \"Pending\":\"pending\", \"In progress\":\"progress\", \"Resolved\":\"resolved\" };\nconst STATUS_LABEL = { \"Pending\":\"PENDING\", \"In progress\":\"IN PROGRESS\", \"Resolved\":\"RESOLVED\" };\n/* services follow the same flow as complaints: Requested -> In progress -> Provided */\nconst SERVICE_STATUS_ORDER = [\"Requested\",\"In progress\",\"Provided\",\"Completed\",\"Cancelled\"];\n\nconst SERVICES = [\n  {id:\"gardening\", ico:\"leaf\", color:\"#3F9D82\", name:\"Gardening\", desc:\"Lawn mowing, plant care, potted garden setup and balcony greenery at your address.\", ext:\"RWA Approved Vendor \u00b7 Ext. 26\", hrs:\"Book 1 day ahead\", cat:\"Maintenance\"},\n  {id:\"plumbing\", ico:\"wrench\", color:\"#4C7EA8\", name:\"Plumbing\", desc:\"Tap and pipe leaks, blocked drains, flush tank and geyser fitting inside your home.\", ext:\"RWA Office \u00b7 Ext. 21\", hrs:\"Same day, within 4 hrs\", cat:\"Water\"},\n  {id:\"electricity\", ico:\"bolt\", color:\"#C9A63C\", name:\"Electricity\", desc:\"Switchboards, fans, wiring faults and appliance fittings inside your home.\", ext:\"RWA Office \u00b7 Ext. 22\", hrs:\"Same day, within 4 hrs\", cat:\"Electricity\"},\n  {id:\"househelp\", ico:\"sparkle\", color:\"#7C7CA0\", name:\"Househelp\", desc:\"Verified maid, cook or part-time help for daily housework, booked through the RWA.\", ext:\"RWA Approved Staff \u00b7 Ext. 27\", hrs:\"Book 1 day ahead\", cat:\"Cleanliness\"}\n];\n\nconst SEED = [\n  {id:\"MG-B-0146\",cat:\"Water\",address:\"B-10, Mayfield Gardens\",title:\"No water supply on 3rd floor since morning\",status:\"In progress\",urgency:\"High\",days:0,note:\"Booster pump valve being replaced.\"},\n  {id:\"MG-B-0145\",cat:\"Maintenance\",address:\"B-702, Mayfield Gardens\",title:\"Lift stops between 6th and 7th floor\",status:\"Pending\",urgency:\"High\",days:1,note:\"\"},\n  {id:\"MG-B-0144\",cat:\"Cleanliness\",address:\"B-108, Mayfield Gardens\",title:\"Garbage not collected from basement bay\",status:\"Pending\",urgency:\"Medium\",days:1,note:\"\"},\n  {id:\"MG-B-0143\",cat:\"Electricity\",address:\"B-10, Mayfield Gardens\",title:\"Corridor lights out on 3rd floor\",status:\"In progress\",urgency:\"Medium\",days:2,note:\"Two fittings replaced, third on order.\"},\n  {id:\"MG-B-0142\",cat:\"Other\",address:\"B-201, Mayfield Gardens\",title:\"Visitor car parked in allotted slot 14\",status:\"Resolved\",urgency:\"Low\",days:3,note:\"Vehicle moved, sticker rule shared with owner.\"},\n  {id:\"MG-B-0140\",cat:\"Security\",address:\"B-609, Mayfield Gardens\",title:\"Intercom not connecting to guard room\",status:\"Resolved\",urgency:\"Medium\",days:6,note:\"Line re-terminated at the DP box.\"},\n  {id:\"MG-B-0139\",cat:\"Water\",address:\"B-10, Mayfield Gardens\",title:\"Leaking tap in the kitchen\",status:\"Resolved\",urgency:\"Low\",days:8,note:\"Washer changed.\"}\n];\n\n/* ---------- state + API (Flask backend) ---------- */\nconst state = { tickets: [] };\n\nconst API = {\n  async list(scope){\n    const d = await api(\"/api/complaints?scope=\" + (scope || \"mine\"));\n    return d.complaints;\n  },\n  async create(p){\n    const d = await api(\"/api/complaints\", { method:\"POST\", body:{\n      category:p.category, address:p.address, title:p.title, details:p.details, urgency:p.urgency, photoData:p.photoData\n    }});\n    return d.complaint;\n  },\n  async updateStatus(id, status){\n    const d = await api(\"/api/complaints/\" + encodeURIComponent(id), { method:\"PATCH\", body:{ status } });\n    return d.complaint;\n  },\n  async listServices(){ return (await api(\"/api/services\")).services; },\n  async bookService(serviceId){ await api(\"/api/services\", { method:\"POST\", body:{ serviceId } }); },\n  async adminServices(){ return (await api(\"/api/services/all\")).services; },\n  async updateService(id, status){\n    return (await api(\"/api/services/\" + encodeURIComponent(id), { method:\"PATCH\", body:{ status } })).service;\n  },\n  async reloadDemo(){ return api(\"/api/admin/reset-demo\", { method:\"POST\" }); }\n};\n\n/* ---------- helpers ---------- */\nconst $  = s => document.querySelector(s);\nconst $$ = s => [...document.querySelectorAll(s)];\nconst esc = s => String(s ?? \"\").replace(/[&<>\"']/g, c => ({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));\n\nfunction ago(ts){\n  const d = Math.floor((Date.now() - ts) / 86400000);\n  if(d <= 0) return \"today\";\n  if(d === 1) return \"yesterday\";\n  return d + \" days ago\";\n}\nfunction badge(status){ return `<span class=\"badge b-${STATUS_CLASS[status]}\">${STATUS_LABEL[status]}<\/span>`; }\n\nfunction toast(msg){\n  let el = $(\"#toast\");\n  if(!el){ el = document.createElement(\"div\"); el.id=\"toast\"; el.className=\"toast\"; document.body.appendChild(el); }\n  el.textContent = msg; el.hidden = false;\n  clearTimeout(el._t); el._t = setTimeout(() => el.hidden = true, 3800);\n}\n\nasync function boot(){\nsession = await loadSession();\nif(!session){\n  parent.go(\"login.html?next=\" + encodeURIComponent(PAGE));\n  return;\n}\nif(session.role === \"admin\" && PAGE !== \"admin.html\"){   /* staff only work from the admin desk */\n  parent.go(\"admin.html\");\n  return;\n}\nif(PAGE === \"admin.html\" && session.role !== \"admin\"){\n  parent.go(\"dashboard.html\");\n  return;\n}\ntry{\n  state.tickets = await API.list(PAGE === \"admin.html\" ? \"all\" : \"mine\");\n}catch(e){\n  state.tickets = [];\n  toast(e.message);\n}\n\n/* ---------- mobile nav drawer ---------- */\nif($(\"#menuBtn\")){\n  $(\"#menuBtn\").addEventListener(\"click\", () => document.body.classList.add(\"nav-open\"));\n  $(\"#scrim\").addEventListener(\"click\", () => document.body.classList.remove(\"nav-open\"));\n  $$(\".side-nav a\").forEach(a => a.addEventListener(\"click\", () => document.body.classList.remove(\"nav-open\")));\n}\n\n/* ---------- sidebar identity + nav state ---------- */\n$$(\".side-nav a\").forEach(a => {\n  if(a.getAttribute(\"href\") === PAGE) a.classList.add(\"is-on\");\n  const isStaff = session && session.role === \"admin\";\n  /* admin sees only the Admin desk; residents never see it */\n  if(isStaff ? a.getAttribute(\"href\") !== \"admin.html\" : a.getAttribute(\"href\") === \"admin.html\") a.hidden = true;\n});\n(function fillIdentity(){\n  const me = currentUser();\n  if($(\"#sideName\")) $(\"#sideName\").textContent = session ? session.name : \"Resident\";\n  if($(\"#sideMeta\")) $(\"#sideMeta\").textContent = session\n    ? (session.role === \"admin\" ? \"RWA Staff \u00b7 \" + (session.staffId || \"\") : `${me.address} \u00b7 Resident`)\n    : \"\";\n})();\nif($(\"#logoutBtn\")) $(\"#logoutBtn\").addEventListener(\"click\", async () => { await clearSession(); parent.go(\"login.html\"); });\n\n/* ---------- small inline icon lookup (mirrors login.html's icon set) ---------- */\nfunction ICON_HTML(name){\n  const MAP = {\n    wrench:'<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.7 6.3a4 4 0 0 0-5.6 5.2L3 17.6V21h3.4l6.1-6.1a4 4 0 0 0 5.2-5.6l-2.6 2.6-2-2 2.6-2.6z\"/><\/svg>',\n    droplet:'<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3s6 7.2 6 11a6 6 0 0 1-12 0c0-3.8 6-11 6-11z\"/><\/svg>',\n    bolt:'<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 2 4 14h6l-1 8 9-12h-6l1-8z\"/><\/svg>',\n    sparkle:'<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v4M12 17v4M3 12h4M17 12h4M6.5 6.5l2 2M15.5 15.5l2 2M17.5 6.5l-2 2M8.5 15.5l-2 2\"/><\/svg>',\n    shield:'<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3 19 6v6c0 4.4-3 8-7 9-4-1-7-4.6-7-9V6l7-3z\"/><\/svg>',\n    circle_x:'<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m9 9 6 6M15 9l-6 6\"/><\/svg>',\n    inbox:'<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12h4l2 3h4l2-3h4\"/><path d=\"M5.5 5h13L21 12v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6L5.5 5z\"/><\/svg>',\n    plus:'<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg>',\n    check:'<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 4 4L19 6\"/><\/svg>',\n    phone:'<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 4h4l2 5-2.4 1.4a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z\"/><\/svg>',\n    clock:'<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 3\"/><\/svg>',\n    calendar:'<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2.2\"/><path d=\"M3 10h18M8 3v4M16 3v4\"/><\/svg>',\n    leaf:'<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 4c0 9-6 15-15 15C5 10 11 4 20 4z\"/><path d=\"M13 11 5 19\"/><\/svg>',\n    arrow_right:'<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg>',\n    send:'<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z\"/><\/svg>'\n  };\n  return MAP[name] || \"\";\n}\n\n/* ============================================================\n   DASHBOARD\n   ============================================================ */\nif($(\"#statStrip\") && $(\"#recentList\")){\n  const me = currentUser();\n  if($(\"#welcomeName\")) $(\"#welcomeName\").textContent = me.name.split(\" \")[0] || \"Resident\";\n\n  const mine = state.tickets;   // the server only returns this resident's complaints\n  const pending = mine.filter(t => t.status === \"Pending\").length;\n  const progress = mine.filter(t => t.status === \"In progress\").length;\n  const resolved = mine.filter(t => t.status === \"Resolved\").length;\n\n  $(\"#statStrip\").innerHTML = `\n    <div class=\"stat st-pending\"><b>${pending}<\/b><span>Pending<\/span><\/div>\n    <div class=\"stat st-progress\"><b>${progress}<\/b><span>In progress<\/span><\/div>\n    <div class=\"stat st-resolved\"><b>${resolved}<\/b><span>Resolved<\/span><\/div>\n    <div class=\"stat st-total\"><b>${mine.length}<\/b><span>Total<\/span><\/div>`;\n\n  const recent = mine.slice(0,4);\n  $(\"#recentList\").innerHTML = recent.length ? recent.map(t => `\n    <div class=\"ticket-row\">\n      <div class=\"t-left\">\n        <span class=\"t-ico\">${ICON_HTML(CAT_ICON[t.cat])}<\/span>\n        <div>\n          <h4>${esc(t.title)}<\/h4>\n          <div class=\"t-meta\">${esc(t.id)} \u00b7 ${esc(t.cat)} \u00b7 ${ago(t.ts)}<\/div>\n        <\/div>\n      <\/div>\n      ${badge(t.status)}\n    <\/div>`).join(\"\")\n    : `<div class=\"empty\">\n        <div class=\"ic-wrap\">${ICON_HTML(\"inbox\")}<\/div>\n        <h3>No complaints yet<\/h3>\n        <p>Spotted an issue in the society? Raise your first complaint.<\/p>\n        <a class=\"btn btn-lime\" href=\"new-complaint.html\">${ICON_HTML(\"plus\")} ADD COMPLAINT<\/a>\n      <\/div>`;\n}\n\n/* ============================================================\n   NEW COMPLAINT\n   ============================================================ */\nif($(\"#complaintForm\")){\n  const f = $(\"#complaintForm\");\n  const me = currentUser();\n\n  const preset = new URLSearchParams(window.__SEARCH).get(\"service\");\n  if(preset){\n    const svc = SERVICES.find(s => s.id === preset);\n    if(svc){\n      f.title.value = svc.name + \" booking\";\n      f.details.value = svc.desc;\n      const r = [...f.category].find(x => x.value === svc.cat);\n      if(r) r.checked = true;\n      const banner = $(\"#svcBanner\");\n      if(banner){ banner.hidden = false; banner.textContent = \"Booking service: \" + svc.name; }\n    }\n  }\n  if(f.address && !f.address.value && me.address !== \"\u2014\") f.address.value = me.address;\n\n  f.addEventListener(\"submit\", async e => {\n    e.preventDefault();\n    const address = f.address.value.trim(), title = f.title.value.trim();\n    if(!address){ toast(\"Add your address so the caretaker knows where to go.\"); f.address.focus(); return; }\n    if(!title){ toast(\"Add a complaint title.\"); f.title.focus(); return; }\n    try{\n      const photoInput = $(\"#complaintPhoto\");\n      let photoData = \"\";\n      const photoFile = photoInput && photoInput.files && photoInput.files[0];\n      if(photoFile){\n        if(!photoFile.type.startsWith(\"image/\")){ toast(\"Please choose an image file.\"); return; }\n        if(photoFile.size > 2 * 1024 * 1024){ toast(\"Photo must be under 2 MB.\"); return; }\n        photoData = await new Promise((resolve,reject) => {\n          const reader = new FileReader();\n          reader.onload = () => resolve(String(reader.result || \"\"));\n          reader.onerror = () => reject(new Error(\"Could not read the photo.\"));\n          reader.readAsDataURL(photoFile);\n        });\n      }\n      const t = await API.create({\n        category: f.category.value, address, title,\n        details: f.details.value.trim(), urgency: f.urgency.value, photoData\n      });\n      parent.go(\"complaints.html?id=\" + encodeURIComponent(t.id));\n    }catch(err){ toast(err.message); }\n  });\n}\n\n/* ============================================================\n   YOUR COMPLAINTS\n   ============================================================ */\nfunction timeline(t){\n  const idx = STATUS_ORDER.indexOf(t.status);\n  const rows = [\n    {h:\"Complaint submitted\", p:`Logged by ${t.address} \u00b7 ${ago(t.ts)}`},\n    {h:\"Work in progress\",    p: t.note || (idx >= 1 ? \"Being looked into.\" : \"Not started yet.\")},\n    {h:\"Resolved\",            p: t.status === \"Resolved\" ? \"Closed by the RWA desk. Reopen if the issue is still there.\" : \"Pending.\"}\n  ];\n  return `<div class=\"timeline\">` + rows.map((c,i) => {\n    const cls = i < idx ? \"done\" : i === idx ? \"current\" : \"\";\n    return `<div class=\"tl-item ${cls}\"><h5>${esc(c.h)}<\/h5><p>${esc(c.p)}<\/p><\/div>`;\n  }).join(\"\") + `<\/div>`;\n}\n\nif($(\"#complaintsList\")){\n  let activeFilter = \"all\";\n\n  function render(){\n    const me = currentUser();\n    const mine = state.tickets;   // the server only returns this resident's complaints\n    $(\"#cnt-all\").textContent = mine.length;\n    $(\"#cnt-pending\").textContent = mine.filter(t => t.status === \"Pending\").length;\n    $(\"#cnt-progress\").textContent = mine.filter(t => t.status === \"In progress\").length;\n    $(\"#cnt-resolved\").textContent = mine.filter(t => t.status === \"Resolved\").length;\n\n    const list = activeFilter === \"all\" ? mine : mine.filter(t => t.status === activeFilter);\n\n    $(\"#complaintsList\").innerHTML = list.length ? list.map(t => `\n      <article class=\"ticket\">\n        <div class=\"ticket-top\">\n          <div>\n            <h4>${esc(t.title)}<\/h4>\n            <div class=\"meta\">${esc(t.id)} \u00b7 ${esc(t.cat)} \u00b7 ${esc(t.address)} \u00b7 raised ${ago(t.ts)} \u00b7 ${esc(t.urgency)} priority<\/div>\n          <\/div>\n          ${badge(t.status)}\n        <\/div>\n        ${t.details ? `<p class=\"muted\" style=\"font-size:.88rem\">${esc(t.details)}<\/p>` : \"\"}\n        ${timeline(t)}\n      <\/article>`).join(\"\")\n      : `<div class=\"empty\">\n          <div class=\"ic-wrap\">${ICON_HTML(\"inbox\")}<\/div>\n          <h3>No complaints yet<\/h3>\n          <p>Raise a complaint and track it here from pending to resolved.<\/p>\n          <a class=\"btn btn-lime\" href=\"new-complaint.html\">${ICON_HTML(\"plus\")} ADD COMPLAINT<\/a>\n        <\/div>`;\n  }\n\n  $$(\"#filterPills .pill\").forEach(btn => btn.addEventListener(\"click\", () => {\n    activeFilter = btn.dataset.filter;\n    $$(\"#filterPills .pill\").forEach(b => b.classList.toggle(\"is-on\", b === btn));\n    render();\n  }));\n\n  const fresh = new URLSearchParams(window.__SEARCH).get(\"id\");\n  if(fresh) toast(`Complaint logged. Your ticket is ${fresh}.`);\n  render();\n}\n\n/* ============================================================\n   SERVICES\n   Services are separate from complaints. Clicking ADD SERVICE\n   saves the selected service for the resident instead of opening\n   the complaint form.\n   ============================================================ */\nif($(\"#svcGrid\")){\n  const isAdmin = session.role === \"admin\";          // only members can add services\n  let bookedServices = [];\n  if(!isAdmin){ try{ bookedServices = await API.listServices(); }catch(e){ toast(e.message); } }\n\n  var renderServices = function(){\n    $(\"#svcGrid\").innerHTML = SERVICES.map(s => {\n      const history = bookedServices.filter(x => x.serviceId === s.id).sort((a,b) => (b.addedAt||0) - (a.addedAt||0));\n      const added = history[0];\n      const canRequestAgain = added && [\"Provided\",\"Completed\",\"Cancelled\"].includes(added.status);\n      return `\n        <article class=\"svc-card\">\n          <span class=\"svc-ico\" style=\"background:${s.color}\">${ICON_HTML(s.ico)}<\/span>\n          <h3>${esc(s.name)}<\/h3>\n          <p>${esc(s.desc)}<\/p>\n          <hr class=\"svc-divider\">\n          <div class=\"svc-meta\">\n            <span>${ICON_HTML(\"phone\")}${esc(s.ext)}<\/span>\n            <span>${ICON_HTML(\"clock\")}${esc(s.hrs)}<\/span>\n          <\/div>\n          ${added ? `<p class=\"muted\" style=\"font-size:.82rem;margin:.2rem 0 .6rem\">Status: <b>${esc(added.status || \"Requested\")}<\/b><\/p>` : \"\"}\n          <button class=\"svc-link svc-add-btn ${added ? \"service-added\" : \"\"}\" type=\"button\" data-service=\"${esc(s.id)}\" ${((added && !canRequestAgain) || isAdmin) ? \"disabled\" : \"\"}>\n            ${isAdmin ? \"MEMBERS ONLY\" : canRequestAgain ? \"REQUEST AGAIN\" : added ? \"SERVICE ADDED\" : \"ADD SERVICE\"} ${ICON_HTML(canRequestAgain ? \"plus\" : added ? \"check\" : \"plus\")}\n          <\/button>\n        <\/article>`;\n    }).join(\"\");\n  };\n\n  const SVC_CLS = { \"Requested\":\"pending\", \"In progress\":\"progress\", \"Provided\":\"resolved\" };\n  function renderMine(){\n    const box = $(\"#mySvc\"); if(!box || isAdmin) return;\n    const rows = bookedServices.map(x => {\n      const nm = x.name || (SERVICES.find(s => s.id === x.serviceId) || {}).name || x.serviceId;\n      const st = x.status || \"Requested\";\n      return `<tr>\n        <td>${esc(nm)}<\/td>\n        <td><span class=\"badge b-${SVC_CLS[st]}\">${esc(st.toUpperCase())}<\/span>${x.note ? `<div class=\"muted\" style=\"font-size:.8rem;margin-top:.3rem\">${esc(x.note)}<\/div>` : \"\"}<\/td>\n        <td class=\"muted\">${x.addedAt ? ago(x.addedAt) : \"\u2014\"}<\/td>\n        <td class=\"muted\">${(x.updatedAt || x.addedAt) ? ago(x.updatedAt || x.addedAt) : \"\u2014\"}<\/td><\/tr>`;\n    }).join(\"\");\n    box.innerHTML = `<h2 style=\"font-size:1.15rem;margin:2rem 0 .8rem\">Your Services &amp; Request History<\/h2>` + (rows\n      ? `<div class=\"table-scroll\"><table><thead><tr><th>Service<\/th><th>Status<\/th><th>Requested<\/th><th>Last update<\/th><\/tr><\/thead><tbody>${rows}<\/tbody><\/table><\/div>`\n      : `<p class=\"muted\" style=\"font-size:.9rem\">You haven't added a service yet. Add one above and the RWA desk will pick it up.<\/p>`);\n  }\n  const _renderServices = renderServices;\n  renderServices = function(){ _renderServices(); renderMine(); };\n  renderServices();\n\n  $(\"#svcGrid\").addEventListener(\"click\", async e => {\n    const btn = e.target.closest(\".svc-add-btn\");\n    if(!btn || btn.disabled) return;\n\n    const service = SERVICES.find(s => s.id === btn.dataset.service);\n    if(!service) return;\n\n    try{\n      await API.bookService(service.id);\n      bookedServices.push({ serviceId: service.id, name: service.name, category: service.cat, status: \"Requested\", addedAt: Date.now() });\n      toast(service.name + \" service added successfully.\");\n    }catch(err){\n      if(err.status === 409) bookedServices.push({ serviceId: service.id });\n      toast(err.message);\n    }\n    renderServices();\n  });\n}\n\n/* ============================================================\n   ADMIN\n   ============================================================ */\nif($(\"#deskBody\")){\n  let adminServices = [];\n  try{ adminServices = await API.adminServices(); }catch(e){ toast(e.message); }\n\n  function renderServiceDesk(){\n    if(!$(\"#svcBody\")) return;\n    const all = adminServices;\n    const n = k => all.filter(s => s.status === k).length;\n    $(\"#svcStrip\").innerHTML = `\n      <div class=\"stat st-pending\"><b>${n(\"Requested\")}<\/b><span>Requested<\/span><\/div>\n      <div class=\"stat st-progress\"><b>${n(\"In progress\")}<\/b><span>In progress<\/span><\/div>\n      <div class=\"stat st-resolved\"><b>${n(\"Provided\")}<\/b><span>Provided<\/span><\/div>\n      <div class=\"stat st-total\"><b>${all.length}<\/b><span>Total<\/span><\/div>`;\n    const cs = $(\"#svcFilterCat\"), keep = cs.value;\n    cs.innerHTML = `<option value=\"all\">All categories<\/option>` + [...new Set(all.map(s => s.category))].map(c => `<option>${esc(c)}<\/option>`).join(\"\");\n    cs.value = [...cs.options].some(o => o.value === keep) ? keep : \"all\";\n    const fs = $(\"#svcFilterStatus\").value, fc = cs.value;\n    const rows = all.filter(s => (fs === \"all\" || s.status === fs) && (fc === \"all\" || s.category === fc));\n    $(\"#svcBody\").innerHTML = rows.length ? rows.map(s => `\n      <tr>\n        <td>${esc(s.name)}<div class=\"muted\" style=\"font-size:.8rem\">${esc(s.category)}<\/div><\/td>\n        <td>${esc(s.addedBy)}<\/td>\n        <td>${esc(s.address)}<\/td>\n        <td class=\"muted\">${ago(s.addedAt)}<\/td>\n        <td class=\"muted\">${ago(s.updatedAt || s.addedAt)}<\/td>\n        <td>\n          <select class=\"svcStatusSel\" data-id=\"${esc(s.id)}\">\n            ${SERVICE_STATUS_ORDER.map(x => `<option ${x === s.status ? \"selected\" : \"\"}>${x}<\/option>`).join(\"\")}\n          <\/select>\n        <\/td>\n      <\/tr>`).join(\"\")\n      : `<tr><td colspan=\"6\"><div class=\"empty\" style=\"border:0\"><h3>No service requests<\/h3><p>Services added by members will appear here.<\/p><\/div><\/td><\/tr>`;\n  }\n  if($(\"#svcFilterStatus\")) $(\"#svcFilterStatus\").addEventListener(\"change\", renderServiceDesk);\n  if($(\"#svcFilterCat\")) $(\"#svcFilterCat\").addEventListener(\"change\", renderServiceDesk);\n  if($(\"#svcBody\")) $(\"#svcBody\").addEventListener(\"change\", async e => {\n    const sel = e.target.closest(\".svcStatusSel\");\n    if(!sel) return;\n    try{\n      const s = await API.updateService(sel.dataset.id, sel.value);\n      const i = adminServices.findIndex(x => x.id === s.id);\n      if(i >= 0) adminServices[i] = s;\n      toast(`${s.name} for ${s.addedBy} marked ${s.status.toLowerCase()}.`);\n    }catch(err){\n      toast(err.message);\n      try{ adminServices = await API.adminServices(); }catch(e2){}\n    }\n    renderServiceDesk();\n  });\n\n  function renderDesk(){\n    const all = state.tickets;\n    const pending = all.filter(t => t.status === \"Pending\").length;\n    const progress = all.filter(t => t.status === \"In progress\").length;\n    const resolved = all.filter(t => t.status === \"Resolved\").length;\n    $(\"#deskStrip\").innerHTML = `\n      <div class=\"stat st-pending\"><b>${pending}<\/b><span>Pending<\/span><\/div>\n      <div class=\"stat st-progress\"><b>${progress}<\/b><span>In progress<\/span><\/div>\n      <div class=\"stat st-resolved\"><b>${resolved}<\/b><span>Resolved<\/span><\/div>\n      <div class=\"stat st-total\"><b>${all.length}<\/b><span>Total<\/span><\/div>`;\n\n    const cats = [...new Set(all.map(t => t.cat))];\n    const sel = $(\"#filterCat\"), keep = sel.value;\n    sel.innerHTML = `<option value=\"all\">All categories<\/option>` + cats.map(c => `<option>${esc(c)}<\/option>`).join(\"\");\n    sel.value = [...sel.options].some(o => o.value === keep) ? keep : \"all\";\n\n    const fs = $(\"#filterStatus\").value, fc = sel.value;\n    const rows = all.filter(t => (fs === \"all\" || t.status === fs) && (fc === \"all\" || t.cat === fc));\n\n    $(\"#deskBody\").innerHTML = rows.length ? rows.map(t => `\n      <tr>\n        <td class=\"idcell\"><span class=\"catdot\" style=\"background:${CAT_DOT[t.cat]}\"><\/span>${esc(t.id)}<\/td>\n        <td>${esc(t.title)}<div class=\"muted\" style=\"font-size:.8rem\">${esc(t.cat)}${esc(t.cat)}<\/div>${t.photoData ? `<a href=\"${esc(t.photoData)}\" target=\"_blank\" rel=\"noopener\" class=\"muted\" style=\"font-size:.8rem;text-decoration:underline\">View attached photo</a>` : \"\"}<\/div><\/td>\n        <td>${esc(t.address)}<\/td>\n        <td>\n          <select class=\"statusSel\" data-id=\"${esc(t.id)}\">\n            ${STATUS_ORDER.map(s => `<option ${s === t.status ? \"selected\" : \"\"}>${s}<\/option>`).join(\"\")}\n          <\/select>\n        <\/td>\n      <\/tr>`).join(\"\")\n      : `<tr><td colspan=\"4\"><div class=\"empty\" style=\"border:0\"><h3>Nothing here<\/h3><p>Clear a filter to see other complaints.<\/p><\/div><\/td><\/tr>`;\n\n    const counts = {};\n    all.forEach(t => counts[t.cat] = (counts[t.cat] || 0) + 1);\n    const max = Math.max(1, ...Object.values(counts));\n    $(\"#catBars\").innerHTML = Object.entries(counts).sort((a,b) => b[1] - a[1]).map(([c,n]) => `\n      <div class=\"bar-row\">\n        <span>${esc(c)}<\/span>\n        <span class=\"bar-track\"><span class=\"bar-fill\" style=\"width:${Math.round(n / max * 100)}%;background:${CAT_DOT[c]}\"><\/span><\/span>\n        <b>${n}<\/b>\n      <\/div>`).join(\"\");\n\n    const pendingOldest = all.filter(t => t.status !== \"Resolved\").sort((a,b) => a.ts - b.ts)[0];\n    $(\"#oldest\").innerHTML = pendingOldest\n      ? `<b style=\"color:var(--ink)\">${esc(pendingOldest.id)}<\/b> \u2014 ${esc(pendingOldest.title)}<br>Open since ${ago(pendingOldest.ts)}, at ${esc(pendingOldest.address)}.`\n      : \"Nothing pending. The block is clear.\";\n  }\n\n  $(\"#filterStatus\").addEventListener(\"change\", renderDesk);\n  $(\"#filterCat\").addEventListener(\"change\", renderDesk);\n  $(\"#deskBody\").addEventListener(\"change\", async e => {\n    const sel = e.target.closest(\".statusSel\");\n    if(!sel) return;\n    try{\n      const t = await API.updateStatus(sel.dataset.id, sel.value);\n      const i = state.tickets.findIndex(x => x.id === t.id);\n      if(i >= 0) state.tickets[i] = t;\n      toast(`${t.id} marked ${t.status.toLowerCase()}.`);\n    }catch(err){\n      toast(err.message);\n      try{ state.tickets = await API.list(\"all\"); }catch(e2){}\n    }\n    renderDesk();\n  });\n  /* Adds back any missing demo complaints (never deletes real records). */\n  if($(\"#resetBtn\")) $(\"#resetBtn\").addEventListener(\"click\", async () => {\n    if(!confirm(\"Add the sample demo complaints that are missing? Existing complaints are kept.\")) return;\n    try{\n      const r = await API.reloadDemo();\n      toast(r.added ? r.added + \" demo complaints added.\" : \"Demo data is already loaded.\");\n      state.tickets = await API.list(\"all\");\n      renderDesk();\n    }catch(err){ toast(err.message); }\n  });\n\n  renderDesk();\n  renderServiceDesk();\n}\n\n} /* end boot() */\n\nboot();\n<\/script>\n<script>document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(!a)return;var h=a.getAttribute('href');if(/\\.html(\\?|$)/.test(h)){e.preventDefault();parent.go(h);}});<\/script><\/body>\n<\/html>\n", "new-complaint.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>New Complaint \u2014 Smart Society<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Newsreader:ital@1&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n<style>/* ============================================================\n   SMART SOCIETY \u2014 Complaint & Service Portal\n   Cream / black / lime theme, sidebar navigation\n   B Block Mayfield Gardens RWA\n   ============================================================ */\n\n:root{\n  --cream:#F2F2F2; --paper:#FFFFFF; --ink:#2B6777; --ink-soft:#5C8794;\n  --line-soft:#C8D8E4; --lime:#52AB98; --amber:#17e1a1; --blue:#4C7EA8;\n  --green:#3F9D82; --purple:#7C7CA0;\n  --r-lg:20px; --r-md:16px; --r-sm:12px; --r-pill:999px;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\nbody{background:var(--cream);color:var(--ink);font-family:\"Inter\",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}\nh1,h2,h3{font-family:\"Space Grotesk\",\"Inter\",sans-serif;font-weight:700;letter-spacing:-.025em;margin:0}\n.tagline{font-family:\"Newsreader\",\"Georgia\",serif;font-style:italic;color:var(--ink-soft);font-size:1rem}\np{margin:0}\na{color:inherit;text-decoration:none}\nbutton,input,select,textarea{font:inherit;color:inherit}\n[hidden]{display:none !important}\n:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px;border-radius:6px}\n.muted{color:var(--ink-soft)}\nsvg.ic{width:1em;height:1em;display:inline-block;vertical-align:-.15em}\ncode{background:var(--cream);border:1px solid var(--line-soft);border-radius:5px;padding:.05rem .35rem;font-size:.85em}\n\n/* ---------- app shell ---------- */\n.app{display:flex;min-height:100vh}\n.main{flex:1;min-width:0;padding:2.4rem 2.8rem 4rem}\n.pagewrap{max-width:980px}\n\n/* ---------- sidebar ---------- */\n.sidebar{width:280px;flex:none;background:var(--ink);color:#F4F4F2;display:flex;flex-direction:column;padding:1.4rem 1.2rem;position:sticky;top:0;height:100vh;overflow-y:auto}\n.brand{display:flex;align-items:center;gap:.7rem;padding:.3rem .2rem 1.4rem;margin-bottom:.6rem;border-bottom:1px solid #3D7D8C}\n.brand-ico{width:42px;height:42px;flex:none;border-radius:12px;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-size:1.25rem}\n.brand b{display:block;font-family:\"Space Grotesk\",sans-serif;font-weight:700;font-size:1.05rem;color:#fff}\n.brand small{display:block;color:#A8C6CE;font-size:.74rem;line-height:1.3;margin-top:.1rem}\n.side-nav{display:flex;flex-direction:column;gap:.3rem;margin-top:1.1rem}\n.side-nav a{display:flex;align-items:center;gap:.75rem;padding:.72rem .9rem;border-radius:var(--r-sm);color:#C3DCE2;font-weight:600;font-size:.92rem}\n.side-nav a:hover{background:#3D7D8C;color:#fff}\n.side-nav a.is-on{background:var(--lime);color:var(--ink)}\n.side-spacer{flex:1;min-height:1.4rem}\n.user-card{border:1px solid #3D7D8C;border-radius:var(--r-md);padding:1rem;background:#245A68}\n.user-card b{display:block;color:#fff;font-size:.94rem}\n.user-card small{display:block;color:#A8C6CE;font-size:.8rem;margin:.2rem 0 .8rem}\n.side-foot{color:#8FB4BD;font-size:.72rem;line-height:1.5;margin-top:1rem;padding:0 .2rem}\n.mobile-bar{display:none}\n.scrim{display:none}\n\n/* ---------- buttons ---------- */\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:1.5px solid var(--ink);border-radius:var(--r-sm);padding:.78rem 1.3rem;font-weight:700;font-size:.85rem;letter-spacing:.02em;cursor:pointer;transition:transform .12s ease,filter .12s ease;background:var(--paper);color:var(--ink)}\n.btn:hover{filter:brightness(.97)}\n.btn:active{transform:translateY(1px)}\n.btn-lime{background:var(--lime);border-color:var(--ink)}\n.btn-dark{background:var(--ink);color:#fff;border-color:var(--ink)}\n.btn-outline{background:transparent}\n.btn-sm{padding:.5rem .85rem;font-size:.78rem;border-radius:10px}\n.wide{width:100%}\n\n/* ---------- page head ---------- */\n.pagehead{margin-bottom:1.8rem}\n.pagehead-row{display:flex;justify-content:space-between;align-items:flex-start;gap:1.2rem;flex-wrap:wrap}\n.pagehead h1{font-size:clamp(2rem,4vw,2.7rem);margin-top:.25rem}\n.pagehead .lede{color:var(--ink-soft);margin-top:.6rem;max-width:60ch;font-size:.96rem}\n\n/* ---------- stat cards ---------- */\n.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.85rem;margin-bottom:1.6rem}\n.stat{border:2px solid var(--ink);border-radius:var(--r-lg);padding:1.3rem 1.4rem;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}\n.stat b{font-family:\"Space Grotesk\",sans-serif;font-size:2.3rem;line-height:1}\n.stat span{font-weight:800;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;margin-top:.5rem}\n.stat.st-pending{background:var(--amber);color:var(--ink)}\n.stat.st-progress{background:var(--blue);color:#fff}\n.stat.st-resolved{background:var(--green);color:#fff}\n.stat.st-total{background:var(--ink);color:var(--lime)}\n\n/* ---------- SDG banner ---------- */\n.sdg{background:var(--ink);color:#EDEDE8;border-radius:var(--r-lg);padding:1.3rem 1.5rem;display:flex;gap:1rem;align-items:flex-start;margin-bottom:2rem}\n.sdg-ico{width:38px;height:38px;flex:none;border-radius:10px;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-size:1.1rem}\n.sdg p{font-size:.92rem;line-height:1.55}\n.sdg b{color:var(--lime)}\n\n/* ---------- section heads ---------- */\n.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}\n.sec-head h2{font-size:1.3rem}\n.view-all{font-weight:700;font-size:.85rem;display:inline-flex;align-items:center;gap:.35rem;border-bottom:2px solid var(--lime);padding-bottom:2px}\n\n/* ---------- generic cards ---------- */\n.card{background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--r-md)}\n.pad{padding:1.5rem}\n\n/* ---------- empty state ---------- */\n.empty{border:2px dashed var(--ink);border-radius:var(--r-lg);background:var(--paper);padding:3rem 1.5rem;text-align:center}\n.empty .ic-wrap{width:50px;height:50px;margin:0 auto .9rem;border-radius:50%;background:var(--cream);display:grid;place-items:center;color:var(--ink-soft);font-size:1.4rem}\n.empty h3{font-size:1.1rem;margin-bottom:.3rem}\n.empty p{color:var(--ink-soft);font-size:.9rem;margin-bottom:1.3rem}\n\n/* ---------- recent / ticket list rows ---------- */\n.ticket-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;border:1.5px solid var(--ink);border-radius:var(--r-md);padding:1.1rem 1.3rem;background:var(--paper)}\n.ticket-row + .ticket-row{margin-top:.7rem}\n.ticket-row .t-left{display:flex;align-items:center;gap:.9rem;min-width:0}\n.ticket-row .t-ico{width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:1.05rem;background:var(--cream)}\n.ticket-row h4{font-size:.96rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.ticket-row .t-meta{font-size:.8rem;color:var(--ink-soft);margin-top:.1rem}\n\n/* ---------- badges ---------- */\n.badge{display:inline-flex;align-items:center;border-radius:var(--r-pill);padding:.32rem .8rem;font-size:.74rem;font-weight:800;letter-spacing:.03em;white-space:nowrap}\n.badge.b-pending{background:var(--amber);color:var(--ink)}\n.badge.b-progress{background:var(--blue);color:#fff}\n.badge.b-resolved{background:var(--green);color:#fff}\n\n/* ---------- services grid ---------- */\n.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}\n.svc-card{border:1.5px solid var(--ink);border-radius:var(--r-md);background:var(--paper);padding:1.4rem;display:flex;flex-direction:column}\n.svc-ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:1.25rem;margin-bottom:.9rem}\n.svc-card h3{font-size:1.08rem;margin-bottom:.4rem}\n.svc-card p{font-size:.87rem;color:var(--ink-soft);flex:1}\n.svc-divider{border:0;border-top:1.5px dashed var(--line-soft);margin:1rem 0 .8rem}\n.svc-meta{display:flex;flex-direction:column;gap:.4rem;font-size:.83rem;color:var(--ink-soft);margin-bottom:1rem}\n.svc-meta span{display:flex;align-items:center;gap:.5rem}\n.svc-link{font-weight:700;font-size:.85rem;display:inline-flex;align-items:center;gap:.35rem;color:var(--ink)}\n\n/* ---------- filter pills ---------- */\n.pills{display:flex;gap:.55rem;flex-wrap:wrap;margin-bottom:1.4rem}\n.pill{border:1.5px solid var(--ink);border-radius:var(--r-pill);padding:.5rem 1.05rem;font-weight:800;font-size:.8rem;letter-spacing:.02em;background:var(--paper);color:var(--ink);cursor:pointer}\n.pill.is-on{background:var(--ink);color:var(--lime)}\n\n/* ---------- form ---------- */\n.field{margin-bottom:1.3rem}\n.field > label{display:block;font-weight:800;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.55rem;color:var(--ink-soft)}\ninput[type=text],input[type=tel],input[type=password],select,textarea{width:100%;background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--r-sm);padding:.78rem .9rem}\ninput::placeholder,textarea::placeholder{color:#93ADB6}\ninput:focus,textarea:focus,select:focus{outline:none;box-shadow:0 0 0 3px rgba(20,20,20,.08)}\ntextarea{min-height:120px;resize:vertical}\n.row2{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}\n\n.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}\n.cat{position:relative;border:1.5px solid var(--ink);border-radius:var(--r-sm);background:var(--paper);padding:.85rem .7rem;display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:.9rem;cursor:pointer}\n.cat input{position:absolute;inset:0;opacity:0;cursor:pointer}\n.cat:has(input:checked){background:#E4EDF3}\n.cat:has(input:focus-visible){outline:2.5px solid var(--ink);outline-offset:2px}\n\n.pri{display:flex;gap:.65rem;flex-wrap:wrap}\n.pri label{position:relative;flex:1;min-width:90px;text-align:center;border:1.5px solid var(--ink);border-radius:var(--r-sm);padding:.72rem .9rem;font-weight:700;font-size:.88rem;background:var(--paper);cursor:pointer}\n.pri input{position:absolute;inset:0;opacity:0;cursor:pointer}\n.pri label:has(input:checked){background:var(--amber);color:var(--ink);border-color:var(--ink)}\n\n/* ---------- ticket detail ---------- */\n.ticket{border:1.5px solid var(--ink);border-radius:var(--r-md);background:var(--paper);padding:1.4rem}\n.ticket + .ticket{margin-top:.9rem}\n.ticket-top{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;flex-wrap:wrap;margin-bottom:.7rem}\n.ticket-top h4{font-size:1.02rem}\n.ticket-top .meta{font-size:.82rem;color:var(--ink-soft);margin-top:.25rem}\n.timeline{border-left:2px solid var(--line-soft);margin:1.1rem 0 0 .55rem;padding-left:1.2rem;display:grid;gap:.9rem}\n.tl-item{position:relative;font-size:.86rem}\n.tl-item::before{content:\"\";position:absolute;left:-1.68rem;top:.28rem;width:11px;height:11px;border-radius:50%;background:var(--paper);border:2px solid var(--line-soft)}\n.tl-item.done::before{background:var(--green);border-color:var(--green)}\n.tl-item.current::before{background:var(--amber);border-color:var(--amber)}\n.tl-item h5{margin:0;font-weight:700;font-size:.88rem}\n.tl-item p{color:var(--ink-soft);font-size:.82rem}\n\n/* ---------- admin table ---------- */\n.table-toolbar{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}\n.table-toolbar select{width:auto;min-width:150px;padding:.55rem .75rem}\n.table-scroll{overflow-x:auto;border:1.5px solid var(--ink);border-radius:var(--r-md);background:var(--paper)}\ntable{width:100%;border-collapse:collapse;font-size:.87rem}\nth{text-align:left;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:800;padding:.85rem 1rem;border-bottom:1.5px solid var(--ink)}\ntd{padding:.85rem 1rem;border-bottom:1px solid var(--line-soft);vertical-align:middle}\ntr:last-child td{border-bottom:0}\ntd.idcell{font-weight:800;white-space:nowrap}\ntd select{width:auto;min-width:130px;padding:.4rem .55rem;font-size:.82rem}\n.catdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:.55rem}\n.two-col{display:grid;grid-template-columns:1.35fr .65fr;gap:1.4rem;align-items:start}\n.bars{display:grid;gap:.75rem}\n.bar-row{display:grid;grid-template-columns:100px 1fr 26px;gap:.7rem;align-items:center;font-size:.83rem}\n.bar-track{height:9px;background:var(--cream);border:1px solid var(--line-soft);border-radius:999px;overflow:hidden}\n.bar-fill{display:block;height:100%}\n.bar-row b{text-align:right;font-size:.8rem;color:var(--ink-soft)}\n\n/* ---------- login / signup ---------- */\n.login-page{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:2rem 1.2rem}\n.login-card{width:100%;max-width:440px;background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--r-lg);padding:2.1rem}\n.login-tabs{display:flex;gap:.4rem;background:var(--cream);border:1.5px solid var(--ink);border-radius:var(--r-sm);padding:.28rem;margin:1.3rem 0 1.5rem}\n.login-tabs button{flex:1;border:0;background:transparent;padding:.6rem;border-radius:9px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--ink-soft)}\n.login-tabs button.is-on{background:var(--ink);color:var(--lime)}\n.error-note{background:#FCEBE7;border:1.5px solid #D9432C;color:#9A2A19;border-radius:10px;padding:.65rem .85rem;font-size:.84rem;font-weight:600;margin-bottom:1rem}\n.ok-note{background:#E7F8EF;border:1.5px solid #12B76A;color:#0B6B41;border-radius:10px;padding:.65rem .85rem;font-size:.84rem;font-weight:600;margin-bottom:1rem}\n.mode-toggle{text-align:center;margin-top:1.1rem;font-size:.86rem;color:var(--ink-soft)}\n.mode-toggle button{background:none;border:0;font-weight:800;color:var(--ink);text-decoration:underline;cursor:pointer;padding:0;font-family:inherit;font-size:inherit}\n.field[data-only=\"signup\"]{display:none}\nform.mode-signup .field[data-only=\"signup\"]{display:block}\n\n/* ---------- toast ---------- */\n.toast{position:fixed;left:50%;bottom:1.6rem;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--lime);font-weight:700;font-size:.9rem;padding:.85rem 1.3rem;border-radius:var(--r-sm);box-shadow:0 16px 34px -14px rgba(0,0,0,.4);max-width:calc(100% - 2rem)}\n\n/* ---------- responsive ---------- */\n@media (max-width:980px){ .svc-grid{grid-template-columns:repeat(2,1fr)} .stats{grid-template-columns:repeat(2,1fr)} }\n@media (max-width:900px){\n  .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .22s ease;width:280px}\n  body.nav-open .sidebar{transform:translateX(0)}\n  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}\n  body.nav-open .scrim{display:block}\n  .mobile-bar{display:flex;align-items:center;gap:.9rem;justify-content:space-between;padding:1rem 1.2rem;border-bottom:1.5px solid var(--ink);background:var(--cream);position:sticky;top:0;z-index:30}\n  .mobile-bar .brand{border:0;padding:0;margin:0}\n  .mobile-bar .brand small /svg> LOG OUT<\/button>\n  <\/div>\n  <p class=\"side-foot\">Aligned with UN SDG 11 &mdash; Sustainable Cities &amp; Communities<\/p>\n<\/aside>\n\n<div style=\"flex:1;min-width:0;display:flex;flex-direction:column\">\n  <div class=\"mobile-bar\">\n    <a class=\"brand\" href=\"dashboard.html\">\n      <span class=\"brand-ico\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 21V6a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v15\"/><path d=\"M14 21v-9a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v9\"/><path d=\"M4 21h16M7 9h1M7 13h1M7 17h1M10 9h1M10 13h1M10 17h1M17 13h1M17 17h1\"/><\/svg><\/span>\n      <span><b>Smart Society<\/b><small>B Block &middot; Mayfield Gardens RWA<\/small><\/span>\n    <\/a>\n    <button class=\"menu-btn\" id=\"menuBtn\" type=\"button\" aria-label=\"Open menu\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 7h16M4 12h16M4 17h16\"/><\/svg><\/button>\n  <\/div>\n  <main class=\"main\">\n    <div class=\"pagewrap\">\n\n      <div class=\"pagehead\">\n        <p class=\"tagline\">Takes less than a minute<\/p>\n        <h1>Add New Complaint<\/h1>\n      <\/div>\n      <div class=\"card pad\">\n        <p class=\"tagline\" id=\"svcBanner\" hidden style=\"margin-bottom:1rem\"><\/p>\n        <form id=\"complaintForm\" novalidate>\n          <div class=\"field\">\n            <label>Category<\/label>\n            <div class=\"cats\">\n              <label class=\"cat\"><input type=\"radio\" name=\"category\" value=\"Maintenance\" checked><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.7 6.3a4 4 0 0 0-5.6 5.2L3 17.6V21h3.4l6.1-6.1a4 4 0 0 0 5.2-5.6l-2.6 2.6-2-2 2.6-2.6z\"/><\/svg>Maintenance<\/label>\n              <label class=\"cat\"><input type=\"radio\" name=\"category\" value=\"Water\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3s6 7.2 6 11a6 6 0 0 1-12 0c0-3.8 6-11 6-11z\"/><\/svg>Water<\/label>\n              <label class=\"cat\"><input type=\"radio\" name=\"category\" value=\"Electricity\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 2 4 14h6l-1 8 9-12h-6l1-8z\"/><\/svg>Electricity<\/label>\n              <label class=\"cat\"><input type=\"radio\" name=\"category\" value=\"Cleanliness\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v4M12 17v4M3 12h4M17 12h4M6.5 6.5l2 2M15.5 15.5l2 2M17.5 6.5l-2 2M8.5 15.5l-2 2\"/><\/svg>Cleanliness<\/label>\n              <label class=\"cat\"><input type=\"radio\" name=\"category\" value=\"Security\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3 19 6v6c0 4.4-3 8-7 9-4-1-7-4.6-7-9V6l7-3z\"/><\/svg>Security<\/label>\n              <label class=\"cat\"><input type=\"radio\" name=\"category\" value=\"Other\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m9 9 6 6M15 9l-6 6\"/><\/svg>Other<\/label>\n            <\/div>\n          <\/div>\n          <div class=\"field\">\n            <label for=\"title\">Complaint title<\/label>\n            <input type=\"text\" id=\"title\" name=\"title\" placeholder=\"e.g. Water leakage in basement parking\">\n          <\/div>\n          <div class=\"field\">\n            <label for=\"details\">Description<\/label>\n            <textarea id=\"details\" name=\"details\" placeholder=\"Describe the issue \u2014 where it is, since when, and how urgent it feels.\"><\/textarea>\n          <\/div>\n          <div class=\"field\">\n            <label for=\"complaintPhoto\">Attach a photo (optional)<\/label>\n            <input type=\"file\" id=\"complaintPhoto\" name=\"complaintPhoto\" accept=\"image/*\">\n            <small class=\"muted\">Choose an image under 2 MB to help explain the issue.<\/small>\n          <\/div>\n          <div class=\"field\">\n            <label>Priority<\/label>\n            <div class=\"pri\">\n              <label><input type=\"radio\" name=\"urgency\" value=\"Low\">Low<\/label>\n              <label><input type=\"radio\" name=\"urgency\" value=\"Medium\" checked>Medium<\/label>\n              <label><input type=\"radio\" name=\"urgency\" value=\"High\">High<\/label>\n            <\/div>\n          <\/div>\n          <div class=\"field\">\n            <label for=\"address\">Address<\/label>\n            <input type=\"text\" id=\"address\" name=\"address\" placeholder=\"B-10, Mayfield Gardens\" autocomplete=\"street-address\">\n          <\/div>\n          <button class=\"btn btn-lime wide\" type=\"submit\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z\"/><\/svg> SUBMIT COMPLAINT<\/button>\n        <\/form>\n      <\/div>\n\n    <\/div>\n  <\/main>\n<\/div>\n<\/div>\n\n<div class=\"toast\" id=\"toast\" hidden><\/div>\n<script>/* ============================================================\n   SMART SOCIETY \u2014 shared auth helpers\n   Loaded by every page (login + app pages) before their own script.\n   Accounts and sessions now live on the Flask backend (/api/auth).\n   The browser only holds an HttpOnly session cookie \u2014 no passwords\n   or account data are kept in localStorage any more.\n   =======
