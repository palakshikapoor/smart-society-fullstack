ss=\"stat st-total\"><b>${all.length}<\/b><span>Total<\/span><\/div>`;\n    const cs = $(\"#svcFilterCat\"), keep = cs.value;\n    cs.innerHTML = `<option value=\"all\">All categories<\/option>` + [...new Set(all.map(s => s.category))].map(c => `<option>${esc(c)}<\/option>`).join(\"\");\n    cs.value = [...cs.options].some(o => o.value === keep) ? keep : \"all\";\n    const fs = $(\"#svcFilterStatus\").value, fc = cs.value;\n    const rows = all.filter(s => (fs === \"all\" || s.status === fs) && (fc === \"all\" || s.category === fc));\n    $(\"#svcBody\").innerHTML = rows.length ? rows.map(s => `\n      <tr>\n        <td>${esc(s.name)}<div class=\"muted\" style=\"font-size:.8rem\">${esc(s.category)}<\/div><\/td>\n        <td>${esc(s.addedBy)}<\/td>\n        <td>${esc(s.address)}<\/td>\n        <td class=\"muted\">${ago(s.addedAt)}<\/td>\n        <td class=\"muted\">${ago(s.updatedAt || s.addedAt)}<\/td>\n        <td>\n          <select class=\"svcStatusSel\" data-id=\"${esc(s.id)}\">\n            ${SERVICE_STATUS_ORDER.map(x => `<option ${x === s.status ? \"selected\" : \"\"}>${x}<\/option>`).join(\"\")}\n          <\/select>\n        <\/td>\n      <\/tr>`).join(\"\")\n      : `<tr><td colspan=\"6\"><div class=\"empty\" style=\"border:0\"><h3>No service requests<\/h3><p>Services added by members will appear here.<\/p><\/div><\/td><\/tr>`;\n  }\n  if($(\"#svcFilterStatus\")) $(\"#svcFilterStatus\").addEventListener(\"change\", renderServiceDesk);\n  if($(\"#svcFilterCat\")) $(\"#svcFilterCat\").addEventListener(\"change\", renderServiceDesk);\n  if($(\"#svcBody\")) $(\"#svcBody\").addEventListener(\"change\", async e => {\n    const sel = e.target.closest(\".svcStatusSel\");\n    if(!sel) return;\n    try{\n      const s = await API.updateService(sel.dataset.id, sel.value);\n      const i = adminServices.findIndex(x => x.id === s.id);\n      if(i >= 0) adminServices[i] = s;\n      toast(`${s.name} for ${s.addedBy} marked ${s.status.toLowerCase()}.`);\n    }catch(err){\n      toast(err.message);\n      try{ adminServices = await API.adminServices(); }catch(e2){}\n    }\n    renderServiceDesk();\n  });\n\n  function renderDesk(){\n    const all = state.tickets;\n    const pending = all.filter(t => t.status === \"Pending\").length;\n    const progress = all.filter(t => t.status === \"In progress\").length;\n    const resolved = all.filter(t => t.status === \"Resolved\").length;\n    $(\"#deskStrip\").innerHTML = `\n      <div class=\"stat st-pending\"><b>${pending}<\/b><span>Pending<\/span><\/div>\n      <div class=\"stat st-progress\"><b>${progress}<\/b><span>In progress<\/span><\/div>\n      <div class=\"stat st-resolved\"><b>${resolved}<\/b><span>Resolved<\/span><\/div>\n      <div class=\"stat st-total\"><b>${all.length}<\/b><span>Total<\/span><\/div>`;\n\n    const cats = [...new Set(all.map(t => t.cat))];\n    const sel = $(\"#filterCat\"), keep = sel.value;\n    sel.innerHTML = `<option value=\"all\">All categories<\/option>` + cats.map(c => `<option>${esc(c)}<\/option>`).join(\"\");\n    sel.value = [...sel.options].some(o => o.value === keep) ? keep : \"all\";\n\n    const fs = $(\"#filterStatus\").value, fc = sel.value;\n    const rows = all.filter(t => (fs === \"all\" || t.status === fs) && (fc === \"all\" || t.cat === fc));\n\n    $(\"#deskBody\").innerHTML = rows.length ? rows.map(t => `\n      <tr>\n        <td class=\"idcell\"><span class=\"catdot\" style=\"background:${CAT_DOT[t.cat]}\"><\/span>${esc(t.id)}<\/td>\n        <td>${esc(t.title)}<div class=\"muted\" style=\"font-size:.8rem\">${esc(t.cat)}${esc(t.cat)}<\/div>${t.photoData ? `<a href=\"${esc(t.photoData)}\" target=\"_blank\" rel=\"noopener\" class=\"muted\" style=\"font-size:.8rem;text-decoration:underline\">View attached photo</a>` : \"\"}<\/div><\/td>\n        <td>${esc(t.address)}<\/td>\n        <td>\n          <select class=\"statusSel\" data-id=\"${esc(t.id)}\">\n            ${STATUS_ORDER.map(s => `<option ${s === t.status ? \"selected\" : \"\"}>${s}<\/option>`).join(\"\")}\n          <\/select>\n        <\/td>\n      <\/tr>`).join(\"\")\n      : `<tr><td colspan=\"4\"><div class=\"empty\" style=\"border:0\"><h3>Nothing here<\/h3><p>Clear a filter to see other complaints.<\/p><\/div><\/td><\/tr>`;\n\n    const counts = {};\n    all.forEach(t => counts[t.cat] = (counts[t.cat] || 0) + 1);\n    const max = Math.max(1, ...Object.values(counts));\n    $(\"#catBars\").innerHTML = Object.entries(counts).sort((a,b) => b[1] - a[1]).map(([c,n]) => `\n      <div class=\"bar-row\">\n        <span>${esc(c)}<\/span>\n        <span class=\"bar-track\"><span class=\"bar-fill\" style=\"width:${Math.round(n / max * 100)}%;background:${CAT_DOT[c]}\"><\/span><\/span>\n        <b>${n}<\/b>\n      <\/div>`).join(\"\");\n\n    const pendingOldest = all.filter(t => t.status !== \"Resolved\").sort((a,b) => a.ts - b.ts)[0];\n    $(\"#oldest\").innerHTML = pendingOldest\n      ? `<b style=\"color:var(--ink)\">${esc(pendingOldest.id)}<\/b> \u2014 ${esc(pendingOldest.title)}<br>Open since ${ago(pendingOldest.ts)}, at ${esc(pendingOldest.address)}.`\n      : \"Nothing pending. The block is clear.\";\n  }\n\n  $(\"#filterStatus\").addEventListener(\"change\", renderDesk);\n  $(\"#filterCat\").addEventListener(\"change\", renderDesk);\n  $(\"#deskBody\").addEventListener(\"change\", async e => {\n    const sel = e.target.closest(\".statusSel\");\n    if(!sel) return;\n    try{\n      const t = await API.updateStatus(sel.dataset.id, sel.value);\n      const i = state.tickets.findIndex(x => x.id === t.id);\n      if(i >= 0) state.tickets[i] = t;\n      toast(`${t.id} marked ${t.status.toLowerCase()}.`);\n    }catch(err){\n      toast(err.message);\n      try{ state.tickets = await API.list(\"all\"); }catch(e2){}\n    }\n    renderDesk();\n  });\n  /* Adds back any missing demo complaints (never deletes real records). */\n  if($(\"#resetBtn\")) $(\"#resetBtn\").addEventListener(\"click\", async () => {\n    if(!confirm(\"Add the sample demo complaints that are missing? Existing complaints are kept.\")) return;\n    try{\n      const r = await API.reloadDemo();\n      toast(r.added ? r.added + \" demo complaints added.\" : \"Demo data is already loaded.\");\n      state.tickets = await API.list(\"all\");\n      renderDesk();\n    }catch(err){ toast(err.message); }\n  });\n\n  renderDesk();\n  renderServiceDesk();\n}\n\n} /* end boot() */\n\nboot();\n<\/script>\n<script>document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(!a)return;var h=a.getAttribute('href');if(/\\.html(\\?|$)/.test(h)){e.preventDefault();parent.go(h);}});<\/script><\/body>\n<\/html>\n"};
const SEED = {"residents": [["B-10, Mayfield Gardens", "Demo Resident B-10"], ["B-702, Mayfield Gardens", "Demo Resident B-702"], ["B-108, Mayfield Gardens", "Demo Resident B-108"], ["B-201, Mayfield Gardens", "Demo Resident B-201"], ["B-609, Mayfield Gardens", "Demo Resident B-609"]], "complaints": [[146, "Water", "B-10, Mayfield Gardens", "No water supply on 3rd floor since morning", "In progress", "High", 0, "Booster pump valve being replaced."], [145, "Maintenance", "B-702, Mayfield Gardens", "Lift stops between 6th and 7th floor", "Pending", "High", 1, ""], [144, "Cleanliness", "B-108, Mayfield Gardens", "Garbage not collected from basement bay", "Pending", "Medium", 1, ""], [143, "Electricity", "B-10, Mayfield Gardens", "Corridor lights out on 3rd floor", "In progress", "Medium", 2, "Two fittings replaced, third on order."], [142, "Other", "B-201, Mayfield Gardens", "Visitor car parked in allotted slot 14", "Resolved", "Low", 3, "Vehicle moved, sticker rule shared with owner."], [140, "Security", "B-609, Mayfield Gardens", "Intercom not connecting to guard room", "Resolved", "Medium", 6, "Line re-terminated at the DP box."], [139, "Water", "B-10, Mayfield Gardens", "Leaking tap in the kitchen", "Resolved", "Low", 8, "Washer changed."]]};

(function load(){

const CAT = {gardening:["Gardening","Maintenance"],plumbing:["Plumbing","Water"],electricity:["Electricity","Electricity"],househelp:["Househelp","Cleanliness"]};
const pub = u => u && {role:u.role,name:u.name,address:u.address||"",phone:u.phone||"",staffId:u.staffId||""};
const fail = (m,s) => { const e = new Error(m); e.status = s||400; throw e; };
const needUser = () => session || fail("Please sign in.",401);
const needAdmin = () => (needUser().role==="admin") || fail("Staff only.",403);

async function mockApi(p, o){
  o = o || {};
  const options = { method: o.method || "GET", credentials: "same-origin", headers: { "Content-Type": "application/json" } };
  if (o.body && options.method !== "GET") options.body = JSON.stringify(o.body);
  const response = await fetch(p, options);
  let data;
  try { data = await response.json(); } catch (e) { data = { ok: false, error: "The server returned an invalid response." }; }
  if (!response.ok || data.ok === false) { const err = new Error(data.error || "Request failed."); err.status = response.status; throw err; }
  return data;
}
async function mockApiRaw(path, o){
  o = o || {}; const method = o.method||"GET", b = o.body||{};
  const url = new URL(path, "http://x"), p = url.pathname;
  if(p==="/api/auth/me") return {ok:true,user:pub(session)};
  if(p==="/api/auth/logout"){ session=null; return {ok:true}; }
  if(p==="/api/auth/login"){
    const id = String(b.identifier||"").trim().toLowerCase();
    const u = db.users.find(x => x.role===b.role && (b.role==="admin" ? x.staffId.toLowerCase()===id : x.address.toLowerCase()===id));
    if(!u || u.password!==b.password) fail("Wrong ID or password.",401);
    session = u; return {ok:true,user:pub(u)};
  }
  if(p==="/api/auth/signup"){
    if(b.role==="admin") fail("Staff accounts can't be created here. Use the demo staff login shown at the top.",403);
    const a = String(b.address||"").trim();
    if(!a || !b.name || String(b.password||"").length<4) fail("Please fill in name, address and a password.");
    if(db.users.some(x=>x.address && x.address.toLowerCase()===a.toLowerCase())) fail("That address is already registered.",409);
    const u = {role:"resident",address:a,name:b.name,phone:b.phone||"",password:b.password};
    db.users.push(u); session = u; return {ok:true,user:pub(u)};
  }
  const u = needUser();
  if(p==="/api/complaints" && method==="GET"){
    const list = url.searchParams.get("scope")==="all" ? (needAdmin(), db.complaints) : db.complaints.filter(c=>c.address===u.address);
    return {ok:true,complaints:[...list].sort((a,b)=>b.ts-a.ts)};
  }
  if(p==="/api/complaints" && method==="POST"){
    if(u.role!=="resident") fail("Residents only.",403);
    if(!b.title||!b.category) fail("Title and category are required.");
    const t = Date.now();
    const c = {id:"MG-B-"+String(++db.seq).padStart(4,"0"),cat:b.category,address:b.address||u.address,title:b.title,details:b.details||"",status:"Pending",urgency:b.urgency||"Medium",note:"",ts:t,updatedTs:t,resident:u.name};
    db.complaints.push(c); return {ok:true,complaint:c};
  }
  let m = p.match(/^\/api\/complaints\/(.+)$/);
  if(m){
    needAdmin(); const c = db.complaints.find(x=>x.id===decodeURIComponent(m[1])) || fail("Not found.",404);
    c.status = b.status; c.updatedTs = Date.now(); return {ok:true,complaint:c};
  }
  if(p==="/api/services" && method==="GET") return {ok:true,services:db.services.filter(s=>s.address===u.address)};
  if(p==="/api/services" && method==="POST"){
    if(u.role!=="resident") fail("Services are for members only.",403);
    const c = CAT[b.serviceId] || fail("Unknown service.");
    if(db.services.some(s=>s.address===u.address && s.serviceId===b.serviceId)) fail("Already requested.",409);
    const t = Date.now();
    db.services.push({id:"s"+(++db.sid),serviceId:b.serviceId,name:c[0],category:c[1],status:"Requested",note:"",addedAt:t,updatedAt:t,addedBy:u.name,address:u.address});
    return {ok:true};
  }
  if(p==="/api/services/all"){ needAdmin(); return {ok:true,services:db.services}; }
  m = p.match(/^\/api\/services\/(.+)$/);
  if(m){
    needAdmin(); const s = db.services.find(x=>x.id===decodeURIComponent(m[1])) || fail("Not found.",404);
    s.status = b.status; s.updatedAt = Date.now(); return {ok:true,service:s};
  }
  if(p==="/api/admin/reset-demo"){ needAdmin(); return {ok:true,added:0}; }
  fail("Not available in the static demo.",404);
}

const f = document.getElementById("f");
function go(target){
  let [name, qs] = String(target).split("?");
  name = name.split("/").pop() || "login.html";
  if(!PAGES[name]) name = "login.html";
  if(name==="index.html") name = "login.html";
  const inject = '<script>window.__PAGE='+JSON.stringify(name)+';window.__SEARCH='+JSON.stringify(qs?("?"+qs):"")+';<\/script>';
  f.srcdoc = PAGES[name].replace(/<head[^>]*>/i, m => m + inject);
  if(!/<head/i.test(PAGES[name])) f.srcdoc = inject + PAGES[name];
}
